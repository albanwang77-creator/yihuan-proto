<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>易换运营后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 布局：左侧固定菜单 + 顶栏 + 内容区；编辑页为主栏 + 右侧设置栏。单一浅色后台风格 */
:root{
  color-scheme:light;
  --bg:#F3F5F9; --panel:#FFFFFF; --side:#101A33; --side-2:#1A2647; --side-fg:#B7C2DC;
  --ink:#16213A; --ink-2:#47526B; --ink-3:#7A8499; --line:#E3E7EF; --line-2:#EEF1F6;
  --brand:#2F55E0; --brand-2:#E8EEFD; --brand-ink:#2340B8;
  --ok:#17845A; --ok-bg:#E3F5EC; --warn:#B26A00; --warn-bg:#FFF3DC; --bad:#C23A3A; --bad-bg:#FDECEC; --mute-bg:#EEF0F4;
  --font:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.app{display:flex;min-height:100%}
.side{width:216px;flex-shrink:0;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-weight:700}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav h6{margin:14px 10px 6px;font-size:11px;font-weight:500;color:#6E7CA0;letter-spacing:.08em}
.nav a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;color:var(--side-fg);text-decoration:none}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:var(--brand);color:#fff}
.nav a .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#E5484D;color:#fff;font-size:11px;display:grid;place-items:center;font-family:var(--mono)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.top .crumb{font-size:15px;font-weight:700}
.top .crumb span{color:var(--ink-3);font-weight:400}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.who select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand-2);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.page{padding:20px 24px 40px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px}
.ph .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-hd h3{margin:0;font-size:15px}
.card-bd{padding:16px}

/* 控件 */
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:#C9D1E0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#F1C4C4}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.icon{width:28px;padding:0}
.lnk{border:0;background:none;color:var(--brand);cursor:pointer;padding:0 4px;font-size:13px}
.lnk.bad{color:var(--bad)}
.lnk:disabled{color:var(--ink-3);cursor:not-allowed}
.inp,.sel,.ta{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;width:100%;min-width:0}
.ta{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(47,85,224,.12)}
.inp.err,.ta.err,.sel.err,.up.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(194,58,58,.1)}
.inp:disabled,.ta:disabled,.sel:disabled{background:#F7F8FB;color:var(--ink-2)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lab{font-size:12.5px;color:var(--ink-2)}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.chk input{width:15px;height:15px;accent-color:var(--brand)}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:#CBD2DF;border:0;cursor:pointer;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{left:18px}

/* 标签 */
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;white-space:nowrap;background:var(--mute-bg);color:var(--ink-2)}
.tag.draft{background:var(--mute-bg);color:var(--ink-2)}
.tag.review{background:var(--warn-bg);color:var(--warn)}
.tag.approved{background:var(--brand-2);color:var(--brand-ink)}
.tag.scheduled{background:#EEE8FD;color:#5B3CC4}
.tag.published{background:var(--ok-bg);color:var(--ok)}
.tag.offline{background:var(--bad-bg);color:var(--bad)}
.tag.line{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.tag.type{background:#F1F3F8;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--ink-3)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* 页签 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.tabs button{height:44px;padding:0 12px;border:0;background:none;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.tabs button em{font-style:normal;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.tabs button.on em{color:var(--brand)}

/* 筛选 + 表格 */
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-2);align-items:flex-end}
.filters .fld{width:180px}
.filters .fld.wide{width:240px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:980px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:10px 12px;background:#FAFBFD;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:#FAFBFE}
.tbl tr.sel td{background:#F4F7FF}
.tbl .t1{font-weight:500;max-width:340px}
.tbl .t2{font-size:12px;color:var(--ink-3);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .ops{white-space:nowrap}
.empty{padding:48px 16px;text-align:center;color:var(--ink-3)}
.pager{display:flex;align-items:center;gap:6px;padding:12px 16px;justify-content:flex-end;flex-wrap:wrap}
.pager .tot{margin-right:auto;color:var(--ink-3);font-size:13px}
.pager button{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:12.5px}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.batch{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#F4F7FF;border-bottom:1px solid #D9E2FB;font-size:13px;flex-wrap:wrap}

/* 编辑页 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.ed-bar{position:sticky;top:56px;z-index:15;background:var(--bg);padding:12px 0;margin:-20px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ed-bar h1{margin:0;font-size:18px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-bar .sp{flex:1}
.langtabs{display:flex;gap:4px;padding:6px;background:#EEF1F7;border-radius:10px;width:max-content}
.langtabs button{height:32px;padding:0 14px;border:0;border-radius:7px;background:transparent;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.langtabs button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(16,26,51,.1)}
.errbox{border:1px solid #F1C4C4;background:var(--bad-bg);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.errbox b{color:var(--bad);font-size:13px;white-space:nowrap;line-height:26px}
.errbox .lst{display:flex;flex-wrap:wrap;gap:6px}
.errbox button{border:1px solid #F1C4C4;background:#fff;color:var(--bad);border-radius:6px;height:26px;padding:0 8px;font-size:12px;cursor:pointer}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:#6B4300}
.banner.info{background:var(--brand-2);color:var(--brand-ink)}
.banner.bad{background:var(--bad-bg);color:#8A2424}
.mods{display:flex;flex-direction:column;gap:12px}
.mod{border:1px solid var(--line);border-radius:10px;background:#fff}
.mod.err{border-color:#E9A3A3}
.mod-hd{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line-2);background:#FAFBFD;border-radius:10px 10px 0 0}
.mod-hd .k{font-size:12px;color:var(--brand-ink);background:var(--brand-2);border-radius:5px;padding:1px 7px}
.mod-hd .lbl{flex:1;min-width:0;height:30px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 8px;font-weight:700}
.mod-hd .lbl:hover{border-color:var(--line)}
.mod-hd .lbl:focus{border-color:var(--brand);background:#fff;outline:none}
.mod-bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:8px;align-items:center}
.li .n{width:22px;height:22px;border-radius:50%;background:var(--brand-2);color:var(--brand-ink);font-size:11.5px;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono)}
.stepc{border:1px solid var(--line-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#FBFCFE}
.addbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:1px dashed #C9D1E0;border-radius:10px;align-items:center}
.addbar span{font-size:12.5px;color:var(--ink-3);margin-right:4px}

/* 上传 */
.up{border:1px dashed #C9D1E0;border-radius:10px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#FAFBFE;color:var(--ink-3);font-size:13px;position:relative;padding:12px;text-align:center}
.up:hover{border-color:var(--brand);color:var(--brand)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgbox{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.thumb{width:140px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#F4F6FA;flex-shrink:0;cursor:zoom-in}
.thumb img{width:100%;height:auto;display:block}
.thumb.cover{width:200px;max-height:none;aspect-ratio:16/9;overflow:hidden}
.thumb.cover img{height:100%;object-fit:cover}
.imeta{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);min-width:160px;flex:1}

/* 侧栏 */
.sidecol{display:flex;flex-direction:column;gap:14px;position:sticky;top:124px;max-height:calc(100vh - 140px);overflow:auto;padding-bottom:4px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.log li{display:grid;grid-template-columns:10px 1fr;gap:8px}
.log li::before{content:"";width:7px;height:7px;border-radius:50%;background:#C9D1E0;margin-top:6px}
.log li:first-child::before{background:var(--brand)}
.log small{display:block;color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
.picked{display:flex;flex-direction:column;gap:6px}
.picked div{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.picked div span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotchk{display:flex;flex-direction:column;gap:8px}
.slotchk label{display:flex;align-items:center;gap:8px;font-size:13px}
.slotchk label em{font-style:normal;margin-left:auto;font-size:12px;color:var(--ink-3);font-family:var(--mono)}

/* 展示位 */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.sitem{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.sitem:last-child{border-bottom:0}
.sitem .ix{width:22px;font-family:var(--mono);color:var(--ink-3);font-size:12.5px}
.sitem .tt{flex:1;min-width:0}
.sitem .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.cap.full{color:var(--warn)}

/* 抽屉 / 弹窗 */
.ov{position:fixed;inset:0;background:rgba(16,26,51,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(16,26,51,.3)}
.modal.wide{width:min(760px,100%)}
.modal-hd{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.modal-hd h3{margin:0;font-size:16px;flex:1}
.modal-bd{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line-2)}
.x{width:30px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1}
.x:hover{background:var(--mute-bg)}
.drawer-ov{position:fixed;inset:0;background:rgba(16,26,51,.35);z-index:55;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(16,26,51,.2)}
.typepick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.typepick button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.typepick button:hover{border-color:var(--brand);background:#F7F9FF}
.typepick b{font-size:15px}
.typepick small{color:var(--ink-3);font-size:12.5px;line-height:1.5}
.plist{border:1px solid var(--line);border-radius:10px;max-height:340px;overflow:auto}
.plist label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.plist label:last-child{border-bottom:0}
.plist label.dis{opacity:.45;cursor:not-allowed}
.plist .tt{flex:1;min-width:0}
.plist .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.tl li{display:grid;grid-template-columns:32px 1fr;gap:10px}
.tl .who2{font-size:12.5px;color:var(--ink-3)}
.tl .txt{margin-top:4px;background:#F7F8FB;border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.files{display:flex;gap:8px;flex-wrap:wrap}
.files button{width:96px;height:72px;border:1px solid var(--line);border-radius:8px;background:#F4F6FA;padding:0;overflow:hidden;cursor:zoom-in}
.files img{width:100%;height:100%;object-fit:cover}

/* 预览 */
.pv{position:fixed;inset:0;z-index:70;background:#E9ECF2;display:flex;flex-direction:column}
.pv-bar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0}
.seg{display:flex;background:#EEF1F7;border-radius:9px;padding:3px}
.seg button{height:28px;padding:0 12px;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(16,26,51,.1)}
.pv-body{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center}
.pv-frame{background:#fff;width:1080px;max-width:100%;border-radius:10px;box-shadow:0 8px 30px rgba(16,26,51,.12);overflow:hidden;align-self:flex-start}
.pv-frame.h5{width:375px;border-radius:30px;border:8px solid #11141C;height:760px;overflow:auto}
.art{color:#14213D;font-family:var(--font)}
.art .hd{background:#EEF3FE;padding:28px 40px;display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:center}
.pv-frame.h5 .art .hd{grid-template-columns:1fr;padding:16px;gap:14px}
.art .hd img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;background:#D8E1F7}
.art .badge{display:inline-block;height:24px;line-height:24px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid #D8E1F7;color:#2A3EC0;font-size:12px}
.art h1{margin:10px 0 0;font-size:28px;line-height:1.35}
.pv-frame.h5 .art h1{font-size:22px}
.art .lead{margin:8px 0 0;color:#3D4660;line-height:1.75}
.art .meta{margin-top:10px;font-size:12px;color:#5B6478;display:flex;gap:12px}
.art .body{padding:28px 40px 36px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}
.pv-frame.h5 .art .body{grid-template-columns:1fr;padding:20px 16px 28px}
.art .content{display:flex;flex-direction:column;gap:12px;min-width:0}
.art h2{margin:14px 0 0;font-size:19px}
.art h2:first-child{margin-top:0}
.art p{margin:0;line-height:1.8;color:#3D4660}
.art .box{background:#F6F8FD;border:1px solid #E6EAF2;border-radius:10px;padding:11px 12px;font-size:14px}
.art.risk .box.q{background:#FFF2F2;border-color:#F5C6C9}
.art .stp{border:1px solid #E6EAF2;border-radius:12px;padding:14px;background:#F6F8FD}
.art .stp .h{display:flex;gap:10px}
.art .stp .n{width:24px;height:24px;border-radius:50%;background:#2F55E0;color:#fff;font-size:12px;display:grid;place-items:center;flex-shrink:0}
.art .stp b{display:block}
.art .stp small{display:block;color:#5B6478;margin-top:2px}
.art .pimg{width:100%;height:auto;display:block;border-radius:10px;cursor:zoom-in;margin-top:10px}
.art figure{margin:0}
.art figcaption{font-size:12px;color:#5B6478;margin-top:6px;text-align:center}
.art blockquote{margin:0;border-left:3px solid #2F55E0;padding:6px 14px;color:#3D4660;background:#F6F8FD;border-radius:0 8px 8px 0}
.art .rel{border:1px solid #E6EAF2;border-radius:14px;padding:14px;align-self:start}
.art .rel h3{margin:0 0 6px;font-size:16px}
.art .rel div{padding:10px 0;border-top:1px solid #E6EAF2;font-size:14px}
.art .rel div:first-of-type{border-top:0}
.lb{position:fixed;inset:0;z-index:90;background:rgba(5,9,20,.88);display:flex;flex-direction:column}
.lb-bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;color:#fff;align-items:center}
.lb-bar span{margin-right:auto;font-size:13px;color:#C9D3EA;font-family:var(--mono)}
.lb-body{flex:1;overflow:auto;display:flex;justify-content:center;padding:0 16px 24px}
.lb-body img{max-width:min(720px,100%);height:auto;align-self:flex-start}
.lb-body.full img{max-width:none}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:100;background:#16213A;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(16,26,51,.3);display:none}
.toast.show{display:block}
.toast.bad{background:var(--bad)}

@media (max-width:1100px){
  .ed{grid-template-columns:1fr}
  .sidecol{position:static;max-height:none}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .nav{flex-direction:row;overflow-x:auto;padding:6px}
  .nav h6{display:none}
  .nav a{white-space:nowrap}
  .top{padding:0 16px;position:static}
  .page{padding:16px}
  .ed-bar{position:static;margin-top:0}
  .grid2{grid-template-columns:1fr}
  .filters .fld,.filters .fld.wide{width:100%}
  .slots{grid-template-columns:1fr}
  .typepick{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
/* ===== 官网前台（PC） ===== */
#site{--w-blue:#2F55E0;--w-deep:#2A3EC0;--w-mid:#3D63E6;--w-navy:#0E2A5A;--w-foot:#1C2A45;--w-tint:#EEF3FE;--w-ink:#14213D;--w-ink2:#3D4660;--w-ink3:#5B6478;--w-line:#E6EAF2;--w-gold:#F5D547;
  background:#fff;color:var(--w-ink);min-height:100%;font:15px/1.6 var(--font)}
.w-wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
.w-hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--w-line)}
.w-hd .w-wrap{height:72px;display:flex;align-items:center;gap:28px}
.w-logo{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0}
.w-logo i{width:38px;height:38px;border-radius:50%;background:var(--w-blue);color:#fff;font-style:normal;font-weight:700;font-size:19px;display:grid;place-items:center}
.w-logo b{font-size:22px;color:var(--w-blue);font-weight:700;letter-spacing:.02em}
.w-nav{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.w-nav button{height:36px;padding:0 16px;border-radius:18px;border:0;background:none;cursor:pointer;color:var(--w-ink);font-size:15px;white-space:nowrap}
.w-nav button:hover{color:var(--w-blue)}
.w-nav button.on{background:var(--w-blue);color:#fff}
.w-tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.w-tool{height:36px;padding:0 10px;border:0;background:none;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--w-ink2);font-size:13.5px;border-radius:8px}
.w-tool:hover{background:var(--w-tint);color:var(--w-blue)}
.w-tool select{border:0;background:transparent;font:inherit;color:inherit;cursor:pointer}
.w-btn{height:48px;padding:0 28px;border-radius:12px;border:0;cursor:pointer;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.w-btn.white{background:#fff;color:var(--w-deep)}
.w-btn.glass{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55)}
.w-btn.blue{background:var(--w-blue);color:#fff}
.w-btn.blue:hover{background:var(--w-deep)}
.w-btn.line{background:#fff;color:var(--w-blue);border:1px solid var(--w-blue)}
.w-btn.sm{height:38px;padding:0 18px;font-size:14px;border-radius:10px;font-weight:500}
.w-sec{padding:72px 0}
.w-sec.tint{background:var(--w-tint)}
.w-h2{margin:0;font-size:34px;line-height:1.3;font-weight:700;text-wrap:balance}
.w-h2.c{text-align:center}
.w-sub{margin:10px 0 0;color:var(--w-ink3);font-size:15px}
.w-sub.c{text-align:center}
.w-hero{background:linear-gradient(160deg,var(--w-deep),var(--w-mid));color:#fff;overflow:hidden}
.w-hero .w-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:72px 0}
.w-hero h1{margin:0;font-size:52px;line-height:1.2;font-weight:700;letter-spacing:.02em}
.w-hero h1 em{font-style:normal;color:var(--w-gold)}
.w-hero .en{margin:14px 0 0;font-size:20px;color:#DCE4FF}
.w-hero .sub{margin:10px 0 0;font-size:17px}
.w-hero .cta{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap}
.w-stats{display:flex;gap:36px;margin:30px 0 64px;flex-wrap:wrap}
.w-stats div b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.w-stats div span{font-size:13px;color:#DCE4FF}
.w-phones{position:relative;height:440px;align-self:end}
.w-phone{position:absolute;bottom:-20px;width:230px;height:440px;border-radius:34px;border:8px solid rgba(255,255,255,.55);border-bottom:0;background:#F4F7FF;padding:18px 14px;color:var(--w-ink)}
.w-phone.p1{left:6%;transform:rotate(-5deg);bottom:-40px;opacity:.85}
.w-phone.p2{right:6%}
.w-phone .bar{height:26px;border-radius:13px;background:#fff;font-size:11px;color:var(--w-ink3);display:flex;align-items:center;padding-left:10px}
.w-phone .ttl{margin-top:16px;font-weight:700;font-size:15px}
.w-phone .grd{margin-top:12px;background:#fff;border-radius:14px;padding:12px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 4px;font-size:10px;text-align:center;color:var(--w-ink2)}
.w-phone .grd i{display:block;width:28px;height:28px;margin:0 auto 4px;border-radius:9px;background:#E3EAFD;box-shadow:inset 0 0 0 7px #E3EAFD,inset 0 0 0 9px var(--w-blue)}
.w-phone .chart{margin-top:12px;height:90px;border-radius:14px;background:#fff;position:relative;overflow:hidden}
.w-phone .chart::after{content:"";position:absolute;left:10px;right:10px;bottom:20px;height:44px;border-top:3px solid var(--w-blue);border-radius:50% 50% 0 0/100% 100% 0 0;transform:skewX(-12deg)}
.w-news{background:var(--w-navy);color:#fff}
.w-news .w-wrap{height:60px;display:flex;align-items:center;gap:22px;overflow:hidden}
.w-news .tag2{border:1px solid var(--w-gold);color:var(--w-gold);border-radius:999px;font-size:11px;padding:0 8px;line-height:18px;flex-shrink:0}
.w-news button{border:0;background:none;color:#fff;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.4)}
.w-news button::before{content:"•";margin-right:8px;color:#AFC3FF}
.w-news .more{margin-left:auto;text-decoration:none;color:#AFC3FF;flex-shrink:0}
.w-news .more::before{content:none}
.w-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.w-ph{border-radius:20px;background:linear-gradient(135deg,#DCE5FB,#9DB3F5);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;min-height:320px}
.w-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.w-chips span{height:34px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid #D8E1F7;display:flex;align-items:center;gap:6px;font-size:14px}
.w-chips span b{font-size:11px;color:var(--w-blue)}
.w-kpi{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap;font-size:14px;color:var(--w-ink2)}
.w-kpi b{color:var(--w-blue);font-size:18px;margin-right:4px}
.w-note{margin-top:18px;font-size:13px;color:var(--w-ink3)}
.w-calc-sec{background:#4A66E6;color:#fff}
.w-calc{background:#fff;color:var(--w-ink);border-radius:24px;padding:28px;box-shadow:0 24px 50px rgba(14,42,90,.25);max-width:440px;justify-self:end;width:100%}
.w-calc h3{margin:0 0 6px;color:var(--w-deep);font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.w-calc h3 small{font-size:12px;color:var(--w-ink3);font-weight:400;font-variant-numeric:tabular-nums}
.w-calc .lab{display:block;margin-top:14px;font-size:13px;color:var(--w-ink3)}
.w-calc .fld2{margin-top:6px;height:62px;border-radius:16px;background:var(--w-tint);display:flex;align-items:center;gap:8px;padding:0 16px}
.w-calc select{border:0;background:transparent;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.w-calc input,.w-calc output{flex:1;min-width:0;width:0;border:0;background:transparent;text-align:right;font-size:26px;font-weight:700;outline:none;font-variant-numeric:tabular-nums;color:var(--w-ink)}
.w-calc output{color:var(--w-blue)}
.w-calc .q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.w-calc .q button{height:34px;border:0;border-radius:10px;background:var(--w-tint);color:var(--w-deep);cursor:pointer}
.w-calc .sw2{display:flex;align-items:center;gap:8px;margin:14px 0 2px}
.w-calc .sw2 span{flex:1;border-top:1px dashed #D4DBEA}
.w-calc .sw2 button{width:40px;height:40px;border-radius:50%;border:1px solid #D4DBEA;background:#fff;color:var(--w-blue);cursor:pointer}
.w-calc .w-btn{width:100%;margin-top:20px}
.w-calc .fine{text-align:center;font-size:12px;color:var(--w-ink3);margin-top:10px}
.w-rv{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:center;margin-top:28px}
.w-bub{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.w-bub i{width:56px;height:56px;border-radius:50%;background:#D4DEFA;color:var(--w-deep);font-style:normal;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.w-bub p{margin:0;border:1px solid var(--w-line);border-radius:14px;padding:14px 18px;background:#fff}
.w-big{font-size:46px;font-weight:700;color:var(--w-blue);font-variant-numeric:tabular-nums}
.w-wallet{position:relative;height:320px;border-radius:24px;background:var(--w-tint);overflow:hidden}
.w-wallet .cd{position:absolute;width:240px;height:146px;border-radius:18px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 32px rgba(14,42,90,.2)}
.w-wallet .cd small{opacity:.85;font-size:12px}.w-wallet .cd b{font-size:26px}.w-wallet .cd span{font-size:12px;letter-spacing:.14em}
.w-qr{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:28px;width:max-content}
.w-qr img{width:132px;height:132px;border-radius:10px;border:1px solid var(--w-line);background:#fff;padding:6px}
.w-ft{background:var(--w-foot);color:#B9C3DA;padding:56px 0 28px;font-size:14px}
.w-ft .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.w-ft h4{margin:0 0 14px;color:#fff;font-size:16px}
.w-ft .cols button{display:block;border:0;background:none;color:#B9C3DA;cursor:pointer;padding:4px 0;font-size:14px;text-align:left}
.w-ft .cols button:hover{color:#fff}
.w-ft .about{margin:36px 0 0;font-size:13px}
.w-ft .ch{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.w-ft .ch button{height:34px;padding:0 16px;border-radius:17px;border:0;background:var(--w-blue);color:#fff;cursor:pointer;font-size:13px}
.w-ft .cp{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:#8C97B3;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.w-back{position:fixed;left:16px;bottom:16px;z-index:40;height:38px;padding:0 14px;border-radius:19px;border:0;background:#101A33;color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(16,26,51,.3)}
/* 页面头 */
.w-phero{background:linear-gradient(180deg,var(--w-tint),#fff);padding:56px 0}
.w-crumb{font-size:13px;color:var(--w-ink3);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.w-crumb button{border:0;background:none;color:var(--w-ink3);cursor:pointer;padding:0;font-size:13px}
.w-crumb button:hover{color:var(--w-blue)}
.w-box{background:#fff;border:1px solid var(--w-line);border-radius:22px;padding:36px;box-shadow:0 16px 40px rgba(14,42,90,.07)}
.w-ticks{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:8px;color:var(--w-ink2)}
.w-ticks li::before{content:"✓";color:var(--w-blue);font-weight:700;margin-right:8px}
.w-x{border:1px solid var(--w-line);border-radius:20px;padding:24px;background:#fff}
.w-x .pill{display:inline-block;height:28px;line-height:28px;padding:0 12px;border-radius:999px;background:var(--w-tint);color:var(--w-deep);font-size:13px;font-variant-numeric:tabular-nums}
.w-x .lab{display:block;margin-top:14px;font-size:13px;color:var(--w-ink3)}
.w-x .fx{margin-top:6px;height:54px;border:1px solid var(--w-line);border-radius:12px;display:flex;align-items:center;padding:0 14px;gap:8px}
.w-x .fx input,.w-x .fx output{flex:1;min-width:0;border:0;outline:none;font-size:20px;font-weight:700;background:transparent;font-variant-numeric:tabular-nums}
.w-x .zf{margin-top:10px;height:36px;border-radius:10px;background:var(--w-tint);color:var(--w-deep);font-size:13px;display:grid;place-items:center}
.w-tblw{overflow-x:auto;border:1px solid var(--w-line);border-radius:16px;margin-top:24px}
table.w-tbl{width:100%;border-collapse:collapse;min-width:1040px;font-variant-numeric:tabular-nums}
.w-tbl th,.w-tbl td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--w-line);font-size:14px}
.w-tbl th{background:#F6F8FD;font-weight:500;font-size:13px;color:var(--w-ink2)}
.w-tbl th small,.w-tbl td small{display:block;font-size:11px;color:var(--w-ink3);font-weight:400}
.w-tbl td:first-child,.w-tbl th:first-child{text-align:left;position:sticky;left:0;background:#fff;box-shadow:1px 0 0 var(--w-line)}
.w-tbl th:first-child{background:var(--w-blue);color:#fff}
.w-tbl td.v{color:var(--w-deep);font-weight:700}
.w-tbl td.na{color:#B0B7C6}
.w-cd{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--w-tint);color:var(--w-blue);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:middle}
.w-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:32px}
.w-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
.w-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}
.w-combo{border:1px solid var(--w-line);border-radius:16px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left}
.w-combo:hover{border-color:var(--w-blue)}
.w-combo .pr{display:flex;align-items:center;gap:8px;color:var(--w-ink3)}
.w-c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.w-combo .vv{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.w-combo .vv small{display:block;font-weight:400;color:var(--w-blue);font-size:12px}
.w-step{position:relative;border:1px solid var(--w-line);border-radius:18px;padding:26px;background:#fff;overflow:hidden}
.w-step em{position:absolute;right:16px;top:6px;font-style:normal;font-size:64px;font-weight:700;color:var(--w-tint)}
.w-step b{position:relative;display:block;font-size:18px;margin-top:14px}
.w-step p{position:relative;margin:8px 0 0;color:var(--w-ink3);font-size:14px}
.w-step i{position:relative;display:block;width:46px;height:46px;border-radius:14px;background:var(--w-tint);box-shadow:inset 0 0 0 12px var(--w-tint),inset 0 0 0 14px var(--w-blue)}
.w-svc{border-radius:16px;overflow:hidden;border:1px solid var(--w-line);background:#fff}
.w-svc .t{height:120px;background:var(--w-tint);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.w-svc .t i{width:54px;height:54px;border-radius:16px;background:var(--w-blue);opacity:.9}
.w-svc .t em{font-style:normal;font-size:30px;font-weight:700;color:#B9C8F7}
.w-svc .b{background:var(--w-navy);color:#fff;padding:14px 18px;min-height:74px}
.w-svc .b b{display:block;font-size:17px}
.w-svc .b small{color:#C9D3EA;font-size:13px}
.w-adv{border:1px solid #CFDBFB;border-radius:16px;padding:22px 22px 22px 84px;position:relative;background:#fff}
.w-adv::before{content:"";position:absolute;left:22px;top:24px;width:44px;height:44px;border-radius:12px;background:var(--w-blue)}
.w-adv b{display:block;color:var(--w-deep);font-size:17px}
.w-adv p{margin:8px 0 0;color:var(--w-ink2);font-size:14px}
/* 内容卡片 */
.w-card{border:1px solid var(--w-line);border-radius:18px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;padding:0;transition:box-shadow .15s,transform .15s;color:var(--w-ink)}
.w-card:hover{box-shadow:0 14px 34px rgba(14,42,90,.12);transform:translateY(-2px)}
.w-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#D8E1F7}
.w-card .in{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.w-card b{font-size:17px;line-height:1.45}
.w-card small{color:var(--w-ink3);font-size:13.5px;line-height:1.6}
.w-card .mt{display:flex;gap:12px;font-size:12px;color:var(--w-ink3);font-variant-numeric:tabular-nums}
.w-tag{display:inline-flex;align-self:flex-start;height:24px;align-items:center;padding:0 10px;border-radius:999px;background:var(--w-tint);color:var(--w-deep);font-size:12px;border:1px solid #D8E1F7}
.w-tag.r{background:#FFF2F2;color:#C8323A;border-color:#F5C6C9}
.w-scard{border:1px solid var(--w-line);border-radius:16px;padding:18px;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--w-ink)}
.w-scard.r{background:#FFF6F6;border-color:#F5C6C9}
.w-scard b{font-size:16px}
.w-scard small{color:var(--w-ink2);font-size:13.5px}
.w-feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;cursor:pointer;text-align:left;border:0;background:none;padding:0;color:var(--w-ink);width:100%}
.w-feature img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px}
.w-feature h3{margin:12px 0 0;font-size:28px}
.w-feature p{margin:10px 0 0;color:var(--w-ink2)}
.w-route{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;background:#fff;border:1px solid var(--w-line);border-radius:24px;padding:40px}
.w-route h3{margin:12px 0 0;font-size:30px;line-height:1.35}
.w-route ul{margin:16px 0 24px;padding-left:20px;color:var(--w-ink2)}
.w-route .vis{border-radius:18px;overflow:hidden;border:1px solid var(--w-line)}

<script>
/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
function fmt(d){if(!d)return '—';d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtD(d){if(!d)return '—';d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const now=()=>new Date().toISOString();
let uidN=1000;const uid=p=>(p||'m')+(++uidN);
let tt;function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2200)}

/* ---------- 示例图片（画布生成） ---------- */
function cv(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);return {src:c.toDataURL('image/jpeg',.82),w,h,name:'image.jpg',size:Math.round(c.toDataURL('image/jpeg',.82).length*0.75)}}
function cover(label,c1,c2){return cv(1200,675,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.92)';rr(x,w*.25,h*.22,w*.5,h*.36,24);x.fill();x.fillStyle='#fff';x.font='700 56px "Noto Sans SC",sans-serif';x.textAlign='center';x.fillText(label,w/2,h*.82)});}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function shot(title,len,hl){return cv(750,len,(x,w,h)=>{x.fillStyle='#F4F6FB';x.fillRect(0,0,w,h);x.fillStyle='#2F55E0';x.fillRect(0,0,w,120);x.fillStyle='#fff';x.font='700 36px "Noto Sans SC",sans-serif';x.fillText(title,40,76);let y=160,i=0;while(y<h-60){const ch=110+((i*37)%90);x.fillStyle='#fff';rr(x,32,y,w-64,ch,18);x.fill();x.fillStyle=i===hl?'#2F55E0':'#D5DCEB';rr(x,56,y+24,60,60,14);x.fill();x.fillStyle='#BCC6DA';rr(x,136,y+30,w-260-((i*53)%120),18,9);x.fill();x.fillStyle='#E1E6F0';rr(x,136,y+62,w-320,14,7);x.fill();if(i===hl){x.strokeStyle='#E5484D';x.lineWidth=5;rr(x,26,y-6,w-52,ch+12,22);x.stroke()}y+=ch+24;i++}x.fillStyle='#2F55E0';rr(x,32,h-110,w-64,80,16);x.fill();x.fillStyle='#fff';x.font='700 30px "Noto Sans SC",sans-serif';x.textAlign='center';x.fillText('确认',w/2,h-58)});}

const TAGS={P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,SPAN:1,FONT:1,A:1,UL:1,OL:1,LI:1,H2:1,H3:1,H4:1,DIV:1,BLOCKQUOTE:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,IMG:1,HR:1};

function sanitize(html){
  const doc=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');const root=doc.body.firstChild;
  const okUrl=u=>/^(https?:|mailto:|data:image\/)/i.test((u||'').trim());
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===8){c.remove();return}
    if(c.nodeType!==1)return;
    let tag=c.tagName;
    if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','META','LINK','TITLE','XML'].includes(tag)){c.remove();return}
    if(tag==='H1'){const h=doc.createElement('h2');while(c.firstChild)h.appendChild(c.firstChild);c.replaceWith(h);walk(h);return}
    if(!TAGS[tag]){walk(c);c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{const k=a.name.toLowerCase();
      if(k==='class'){const v=a.value.split(/\s+/).filter(x=>CLS[x]);v.length?c.setAttribute('class',v.join(' ')):c.removeAttribute('class');return}
      if(!ATTR[k]||/^on/.test(k)||((k==='href'||k==='src')&&!okUrl(a.value))||(k==='style'&&/expression|url\(/i.test(a.value)))c.removeAttribute(a.name)});
    if(tag==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
    walk(c);
  })})(root);
  return root.innerHTML;
}

    const s=getSelection();if(!s.rangeCount||s.isCollapsed){toast('先选中要加链接的文字',1);return}
    RT_RANGE=s.getRangeAt(0).cloneRange();
    modal({title:'插入链接',body:`<div class="fld"><label for="lk">链接地址</label><input class="inp" id="lk" placeholder="https://"></div><span class="hint" id="lkh"></span>`,foot:`<button class="btn" data-act="close">取消</button><button class="btn pri" id="okBtn">确定</button>`});
    $('#okBtn').onclick=()=>{const u=$('#lk').value.trim();if(!/^(https?:\/\/|mailto:)/i.test(u)){$('#lkh').textContent='请输入以 http:// 或 https:// 开头的地址';$('#lkh').style.color='var(--bad)';return}
      closeLayer();rteRestore(ed);document.execCommand('createLink',false,u);ed.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'});rteSync(ed)};
    return;
  }
  if(cmd==='formatBlock')document.execCommand('formatBlock',false,arg);
  else if(cmd==='clear'){document.execCommand('removeFormat');document.execCommand('formatBlock',false,'p');document.execCommand('unlink')}
  else if(cmd==='table')rteBlock(ed,'<table border="1" style="width:100%;border-collapse:collapse"><tbody><tr><td style="padding:8px"><b>项目</b></td><td style="padding:8px"><b>说明</b></td></tr><tr><td style="padding:8px">&nbsp;</td><td style="padding:8px">&nbsp;</td></tr></tbody></table>');
  else if(cmd==='tip'||cmd==='warn')rteBlock(ed,`<div class="${cmd}">${cmd==='tip'?'提示内容':'警示内容'}</div>`);
  else if(cmd==='quote')document.execCommand('formatBlock',false,'blockquote');

}
/* 在光标所在段落之后插入块级元素（提示框、表格），不拆进段落里 */
function rteBlock(ed,html){
  const sel=getSelection();let n=sel.rangeCount?sel.getRangeAt(0).startContainer:null;
  while(n&&n.parentNode!==ed)n=n.parentNode;
  const tmp=document.createElement('div');tmp.innerHTML=html;const blk=tmp.firstChild,after=document.createElement('p');after.innerHTML='<br>';
  if(n&&n!==ed){n.after(blk);blk.after(after)}else{ed.appendChild(blk);ed.appendChild(after)}
  const r=document.createRange();r.selectNodeContents(blk.querySelector('td')||blk);sel.removeAllRanges();sel.addRange(r);
}
function rtePaste(e){
  const ed=e.target.closest&&e.target.closest('.rte');if(!ed)return;e.preventDefault();
  const cd=e.clipboardData,html=cd.getData('text/html'),text=cd.getData('text/plain');

}

let curHash='',skipHash=false;
function route(){
  const h=location.hash||'#/contents';
  if(skipHash){skipHash=false;return}
  if(E&&E.dirty&&curHash.startsWith('#/edit')||E&&E.dirty&&curHash.startsWith('#/new')){
    if(!h.startsWith(curHash)){const target=h;skipHash=true;location.hash=curHash;
      confirmBox('离开编辑页','当前修改尚未保存，离开后将丢失。','不保存，离开',()=>{E.dirty=false;location.hash=target},true);return}
  }
  curHash=h;closeLayer();['#pv','#lb'].forEach(q=>{const x=$(q);x&&x.remove()});
  const parts=h.split('/'),[,r,arg]=parts;
  const isSite=r==='site';document.querySelector('.app').hidden=isSite;$('#site').hidden=!isSite;
  if(isSite){E=null;return renderSite(parts.slice(2))}
  renderNav(r==='edit'||r==='new'?'contents':r);
  window.scrollTo(0,0);
  if(r==='edit')return pageEdit(arg);
  if(r==='new')return pageNew(arg);
  E=null;
  if(r==='slots')return pageSlots();
  if(r==='cats')return pageCats();

  if(r==='settings')return pageSettings();

}

    if(a==='t'){CT=t.dataset.v;pageCats()}
    else if(a==='up'||a==='down'){moveArr(list,i,a==='up'?-1:1);pageCats()}
    else if(a==='red'){list[i].red=!list[i].red;toast(list[i].red?'已标红，官网分类标签显示为红色':'已取消标红');pageCats()}
    else if(a==='sw'){list[i].on=!list[i].on;toast(list[i].on?'已启用':'已停用，新内容不可再选此分类');pageCats()}
    else if(a==='del')confirmBox('删除分类',`删除「${esc(list[i].zh)}」？`,'删除',()=>{list.splice(i,1);toast('已删除');pageCats()},true);
    else if(a==='edit'||a==='add')catBox(a==='edit'?list[i]:null);};
}
function catBox(c){
  modal({title:c?'编辑分类':'新增分类 · '+TYPES[CT].zh,body:`<div class="fld"><label class="req" for="cz">中文名称</label><input class="inp" id="cz" maxlength="12" value="${esc(c?c.zh:'')}"></div><div class="fld"><label class="req" for="ce">English</label><input class="inp" id="ce" maxlength="30" value="${esc(c?c.en:'')}"></div><span class="hint" id="cerr" style="color:var(--bad)"></span>`,
    foot:`<button class="btn" data-act="close">取消</button><button class="btn pri" id="okBtn">保存</button>`});
  $('#okBtn').onclick=()=>{const z=$('#cz').value.trim(),en=$('#ce').value.trim();
    if(!z||!en){$('#cerr').textContent='中英文名称都需要填写';(!z?$('#cz'):$('#ce')).classList.add('err');return}
    if(S.cats[CT].some(x=>x!==c&&x.zh===z)){$('#cerr').textContent='已有同名分类';$('#cz').classList.add('err');return}
    if(c){c.zh=z;c.en=en}else S.cats[CT].push({id:uid('c'),zh:z,en,on:true});closeLayer();toast('已保存');pageCats()};
}

/* ---------- 合作申请 ---------- */
/* 状态机：待审核 →(开始审核)→ 审核中 →(签约, 需≥1条跟进记录)→ 已签约
          待审核 / 审核中 →(拒绝, 必填原因)→ 已拒绝；已签约、已拒绝为终态 */
const AST={pending:['待审核','review'],reviewing:['审核中','approved'],signed:['已签约','published'],rejected:['已拒绝','offline']};
const AS={tab:'all',q:'',country:'',owner:''};
const mName=id=>(S.members.find(m=>m.id===id)||{}).name||'';
const recs=a=>a.notes.filter(n=>!n.sys);
const evAt=(a,t)=>{const n=a.notes.find(x=>x.sys&&x.text.startsWith(t));return n?n.at:null};
function pageApps(){
  crumb('合作申请');
  const q=AS.q.trim().toLowerCase();
  const base=S.apps.filter(a=>(!AS.country||a.country===AS.country)&&(!AS.owner||(AS.owner==='none'?!a.owner:a.owner===AS.owner))&&(!q||(a.id+a.name+a.person+a.handle).toLowerCase().includes(q))).sort((a,b)=>new Date(b.at)-new Date(a.at));
  const rows=base.filter(a=>AS.tab==='all'||a.status===AS.tab);
  const countries=[...new Set(S.apps.map(a=>a.country))];
  const owners=[...new Set(S.apps.map(a=>a.owner).filter(Boolean))];
  $('#page').innerHTML=`<div class="ph"><h1>合作申请</h1></div><div class="card">
  <div class="tabs">${[['all','全部'],...Object.entries(AST).map(([k,v])=>[k,v[0]])].map(([k,t])=>`<button class="${AS.tab===k?'on':''}" data-act="tab" data-v="${k}">${t}<em>${base.filter(a=>k==='all'||a.status===k).length}</em></button>`).join('')}</div>
  <div class="filters"><div class="fld wide"><label for="aq">名称 / 联系人 / 编号</label><input class="inp" id="aq" value="${esc(AS.q)}" placeholder="输入关键词"></div>
    <div class="fld"><label for="ac">国家地区</label><select class="sel" id="ac"><option value="">全部</option>${countries.map(c=>`<option ${AS.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="fld"><label for="ao">跟进人</label><select class="sel" id="ao"><option value="">全部</option><option value="none" ${AS.owner==='none'?'selected':''}>未开始审核</option>${owners.map(id=>`<option value="${id}" ${AS.owner===id?'selected':''}>${esc(mName(id))}</option>`).join('')}</select></div>
    <button class="btn" data-act="reset">重置</button></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>编号</th><th>商户名称</th><th>联系人</th><th>联系方式</th><th>国家地区</th><th>业务类型</th><th>预计月交易量</th><th>提交时间</th><th>跟进人</th><th style="text-align:right">跟进次数</th><th>状态</th><th>操作</th></tr></thead><tbody>
  ${rows.map(a=>`<tr style="cursor:pointer" data-act="open" data-id="${a.id}"><td class="mono">${a.id}</td><td><b style="font-weight:500">${esc(a.name)}</b></td><td>${esc(a.person)}</td><td><span class="tag line">${esc(a.method)}</span> <span class="mono">${esc(a.handle)}</span></td><td>${esc(a.country)}</td><td>${esc(a.biz)}</td><td>${esc(a.vol)}</td><td class="mono">${fmt(a.at)}</td><td>${a.owner?esc(mName(a.owner)):'<span class="hint">—</span>'}</td><td class="mono" style="text-align:right">${recs(a).length}</td><td><span class="tag ${AST[a.status][1]}">${AST[a.status][0]}</span></td><td><button class="lnk" data-act="open" data-id="${a.id}">${a.status==='pending'||a.status==='reviewing'?'处理':'查看'}</button></td></tr>`).join('')||'<tr><td colspan="12"><div class="empty">没有符合条件的申请</div></td></tr>'}
  </tbody></table></div><div class="pager"><span class="tot">共 <b class="num">${rows.length}</b> 条</span></div></div>`;
  const P=$('#page');
  $('#aq').oninput=e=>{AS.q=e.target.value;clearTimeout(P._t);P._t=setTimeout(()=>{pageApps();const i=$('#aq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $('#ac').onchange=e=>{AS.country=e.target.value;pageApps()};$('#ao').onchange=e=>{AS.owner=e.target.value;pageApps()};
  P.onclick=e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
    if(a==='tab'){AS.tab=t.dataset.v;pageApps()}else if(a==='reset'){Object.assign(AS,{q:'',country:'',owner:''});pageApps()}else if(a==='open')appDrawer(t.dataset.id)};
}
function appProgress(a){
  const st=a.status,end=st==='signed'?['已签约',evAt(a,'签约')]:st==='rejected'?['已拒绝',evAt(a,'拒绝')]:['已签约 / 已拒绝',null];
  const steps=[['提交申请',a.at,'done'],['审核中',evAt(a,'开始审核'),st==='pending'?'':st==='reviewing'?'cur':'done'],[end[0],end[1],st==='signed'?'done':st==='rejected'?'bad':'']];
  return `<ol class="aprog">${steps.map(([t,at,c])=>`<li class="${c}"><i></i><b>${t}</b><small class="mono">${at?fmt(at):'—'}</small></li>`).join('')}</ol>`;
}
function appDrawer(id){
  const a=S.apps.find(x=>x.id===id),ok=can('biz'),st=AST[a.status],R=recs(a);
  const live=a.status==='pending'||a.status==='reviewing';
  $('#layer').innerHTML=`<div class="drawer-ov" data-act="ov-bg"><aside class="drawer" role="dialog" aria-label="合作申请详情">
    <div class="modal-hd"><h3>${esc(a.name)} <span class="tag ${st[1]}" style="vertical-align:2px">${st[0]}</span></h3><button class="x" data-act="close" aria-label="关闭">×</button></div>
    <div class="modal-bd">
      <div class="fld"><span class="lab">审核进度</span>${appProgress(a)}</div>
      <dl class="kv" style="grid-template-columns:96px 1fr"><dt>编号</dt><dd class="mono">${a.id}</dd>
        <dt>跟进人</dt><dd>${a.owner?`<span class="row" style="gap:8px"><span class="av">${esc(mName(a.owner)[0])}</span>${esc(mName(a.owner))}</span>`:'<span class="hint">开始审核后自动设为操作人</span>'}</dd>
        <dt>联系人</dt><dd>${esc(a.person)}</dd>
        <dt>联系方式</dt><dd><span class="tag line">${esc(a.method)}</span> <span class="mono" id="hdl">${esc(a.handle)}</span> <button class="lnk" id="cpy">复制</button></dd>
        <dt>国家地区</dt><dd>${esc(a.country)}</dd><dt>业务类型</dt><dd>${esc(a.biz)}</dd><dt>预计月交易量</dt><dd>${esc(a.vol)}</dd>
        <dt>提交时间</dt><dd class="mono">${fmt(a.at)}</dd><dt>合作说明</dt><dd>${esc(a.desc)}</dd></dl>
      <div class="fld"><span class="lab">资质附件</span>${a.files.length?`<div class="files">${a.files.map((f,i)=>`<button data-f="${i}" aria-label="查看附件 ${i+1}"><img src="${f.src}" alt=""></button>`).join('')}</div>`:'<span class="hint">未上传</span>'}</div>
      <div class="fld"><span class="lab">跟进记录 <span class="hint">${R.length} 条</span></span>
        ${ok&&a.status==='reviewing'?`<textarea class="ta" id="note" rows="3" placeholder="记录本次沟通情况，可多次添加"></textarea><div><button class="btn sm" id="addNote" disabled>添加跟进记录</button></div>`:''}
        ${ok&&a.status==='pending'?'<span class="hint">开始审核后可以添加跟进记录</span>':''}
        ${a.notes.length?`<ul class="tl">${[...a.notes].reverse().map(n=>n.sys?`<li class="sys"><span class="av">·</span><div><div class="who2">${esc(n.who)} · <span class="mono">${fmt(n.at)}</span></div><div class="txt"><span class="tag line">${esc(n.text.split('：')[0])}</span>${n.text.includes('：')?' '+esc(n.text.slice(n.text.indexOf('：')+1)):''}</div></div></li>`:`<li><span class="av">${esc(n.who[0])}</span><div><div class="who2">${esc(n.who)} · <span class="mono">${fmt(n.at)}</span></div><div class="txt">${esc(n.text)}</div></div></li>`).join('')}</ul>`:'<span class="hint">暂无记录</span>'}
      </div>
    </div>
    ${ok&&live?`<div class="modal-ft">${a.status==='pending'?`<button class="btn danger" data-a="reject">拒绝</button><button class="btn pri" data-a="start">开始审核</button>`:`<span class="hint" style="margin-right:auto">${R.length?'':'至少添加 1 条跟进记录才能签约'}</span><button class="btn danger" data-a="reject">拒绝</button><button class="btn ok" data-a="sign" ${R.length?'':'disabled'}>签约</button>`}</div>`:''}
  </aside></div>`;
  const L=$('#layer');
  $('#cpy').onclick=()=>{const done=()=>toast('已复制');navigator.clipboard&&navigator.clipboard.writeText(a.handle).then(done,()=>{const r=document.createRange();r.selectNode($('#hdl'));getSelection().removeAllRanges();getSelection().addRange(r);toast('已选中，按 Ctrl+C 复制')})};
  L.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>openLB(Object.assign({name:'附件'},a.files[+b.dataset.f])));
  const refresh=()=>{renderNav('apps');pageApps();appDrawer(id)};
  const note=(t,sys)=>a.notes.push({at:now(),who:me().name,text:t,...(sys?{sys:1}:{})});
  if(!ok)return;
  const ta=$('#note');if(ta){ta.oninput=()=>$('#addNote').disabled=!ta.value.trim();$('#addNote').onclick=()=>{note(ta.value.trim());toast('已添加跟进记录');refresh()}}
  L.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const k=b.dataset.a;
    if(k==='start'){a.owner=S.me;a.status='reviewing';note('开始审核',1);toast('已开始审核，跟进人：'+me().name);refresh();return}
    const isOk=k==='sign';
    if(isOk&&!recs(a).length)return toast('至少添加 1 条跟进记录才能签约',1);
    modal({title:isOk?'确认签约':'拒绝合作申请',body:`<div class="hint">${esc(a.name)} · ${a.id}</div>${isOk?`<div>确认已与该商家达成合作？签约后状态不可再变更。</div><div class="fld"><label for="dr">签约说明（选填）</label><textarea class="ta" id="dr" rows="3" placeholder="例如合作内容、费率、合同编号"></textarea></div>`:`<div class="fld"><label class="req" for="dr">拒绝原因</label><textarea class="ta" id="dr" rows="4"></textarea></div><div class="hint">拒绝后不可重新打开，商家需在官网重新提交申请。</div>`}`,
      foot:`<button class="btn" id="cBack">取消</button><button class="btn ${isOk?'ok':'danger solid'}" id="okBtn" ${isOk?'':'disabled'}>${isOk?'确认签约':'拒绝'}</button>`});
    if(!isOk)$('#dr').oninput=e=>$('#okBtn').disabled=!e.target.value.trim();
    $('#cBack').onclick=()=>appDrawer(id);
    $('#okBtn').onclick=()=>{const v=$('#dr').value.trim();if(!a.owner)a.owner=S.me;a.status=isOk?'signed':'rejected';note((isOk?'签约':'拒绝')+(v?'：'+v:''),1);toast(isOk?'已签约':'已拒绝');refresh()};
  });
}

/* ---------- 系统设置 ---------- */
function pageSettings(){
  crumb('系统设置');const ok=can('admin');const n=S.notify;
  $('#page').innerHTML=`<div class="ph"><h1>系统设置</h1></div><div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><div class="card-hd"><h3>合作申请通知</h3></div><div class="card-bd" style="display:flex;flex-direction:column;gap:16px;max-width:560px">
    <div class="row" style="gap:12px;flex-wrap:nowrap"><button class="sw" role="switch" aria-checked="${n.tg.on}" aria-label="Telegram 通知" data-act="ntg" ${ok?'':'disabled'}></button><div class="fld" style="flex:1"><label for="ntg">Telegram 群</label><input class="inp" id="ntg" value="${esc(n.tg.target)}" ${ok&&n.tg.on?'':'disabled'}></div></div>
    <div class="row" style="gap:12px;flex-wrap:nowrap"><button class="sw" role="switch" aria-checked="${n.mail.on}" aria-label="邮件通知" data-act="nml" ${ok?'':'disabled'}></button><div class="fld" style="flex:1"><label for="nml">邮件接收人</label><input class="inp" id="nml" value="${esc(n.mail.to)}" placeholder="多个邮箱用逗号分隔" ${ok&&n.mail.on?'':'disabled'}></div></div>
    ${ok?`<div><button class="btn pri" data-act="savn">保存</button></div>`:''}
  </div></div></div>`;
  const P=$('#page');
  P.onclick=e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act;
    if(a==='ntg'){n.tg.on=!n.tg.on;pageSettings()}
    else if(a==='nml'){n.mail.on=!n.mail.on;pageSettings()}
    else if(a==='savn'){const em=$('#nml').value.trim();if(n.mail.on&&!/^[^@\s,]+@[^@\s,]+\.[^@\s,]+(\s*,\s*[^@\s,]+@[^@\s,]+\.[^@\s,]+)*$/.test(em)){$('#nml').classList.add('err');return toast('邮箱格式不正确',1)}
      if(n.tg.on&&!$('#ntg').value.trim()){$('#ntg').classList.add('err');return toast('请填写 Telegram 群',1)}
      n.tg.target=$('#ntg').value.trim();n.mail.to=em;toast('已保存')}};
}
/* ---------- 启动 ---------- */
seed();
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='close'&&t.closest('#layer'))closeLayer();
  if(t.dataset.act==='ov-bg'&&e.target===t)closeLayer();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#lb'))return $('#lb').remove();if($('#layer').innerHTML)return closeLayer();if($('#pv'))$('#pv').remove()});
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',e=>{if(E&&E.dirty){e.preventDefault();e.returnValue=''}});
setInterval(()=>{let n=0;S.contents.forEach(c=>{if(c.status==='scheduled'&&new Date(c.scheduleAt)<=new Date()){c.status='published';c.publishedAt=now();c.scheduleAt=null;c.versions.unshift({no:c.versions.length+1,at:now(),who:'系统',act:'定时发布',snap:clone({...c.data,cat:c.cat,riskLevel:c.riskLevel,related:c.related})});c.log.unshift({at:now(),who:'系统',act:'定时发布上线'});n++}});if(n&&!E&&location.hash.startsWith('#/contents'))pageList()},30000);
route();


</script>
